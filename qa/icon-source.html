<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<link rel="stylesheet" href="../web/fonts/fonts.css">
<link rel="stylesheet" href="../web/css/dua.css">
<style>
  :root { --page-w: 1024px; --page-h: 1024px; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body { background: none; }
  #icon { position: absolute; top: 0; left: 0; width: 1024px; height: 1024px; }
  #icon .cover-ornament { width: 240px; }
  #icon .cover-ornament::after { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="icon" class="face grain-face cover">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <div class="cover-title">DUA</div>
  <div class="cover-ornament"></div>
</div>
</body>
</html>
